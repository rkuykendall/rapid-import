[package]
name = "rapid-import"
description = "Photo/video auto-sort and import tool with multi-source date resolution."
edition = "2024"
rust-version = "1.92"

[lib]
name = "rapid_import_core"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
regex = "1.12"
walkdir = "2.5"
kamadak-exif = "0.6.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
image = "0.25"
image_hasher = "3.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.23"

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.release]
codegen-units = 1
lto = true
strip = true
